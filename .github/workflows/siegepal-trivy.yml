name: SiegePal Trivy
on:
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
  checks: write
jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy
        id: scan
        continue-on-error: true
        run: >
          docker run --rm -v "$PWD:/workspace" aquasec/trivy:0.56.1
          fs --exit-code 0 --scanners vuln,secret,misconfig
          --format sarif --output /workspace/trivy.sarif /workspace
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siegepal-trivy-results
          path: trivy.sarif
      - name: Notify SiegePal
        continue-on-error: true
        env:
          SIEGEPAL_CALLBACK_URL: "https://fkifoxniqz.a.pinggy.link/github/scan-callback/?token=9yZCE1o7luvFZzcTYQYtQ2fJa91HZitbR6gJEK3JnoQ"
        run: >
          curl -sS -X POST "$SIEGEPAL_CALLBACK_URL"
          -H "Content-Type: application/json"
          -d '{"repository":"mdespain35/CSE341","run_id":"${{ github.run_id }}","category":"sca"}'
          || true
